name: Bug or slow case
description: A crash, a wrong result, an error that should not happen, or something much slower than expected.
labels: ["bug"]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, Python code or viewer steps.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: >
        The output or error. For a slow case, the time and how you measured it.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and model
      description: >
        `llevant --version`, the operating system (and GPU, for the viewer), and
        `llevant info model.i` for the model's size.
      render: text
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: A small input that shows it
      description: >
        If you can. Models are often confidential: a few cells cut out of the model
        are usually enough. Do not attach anything you may not share publicly.
      render: text
