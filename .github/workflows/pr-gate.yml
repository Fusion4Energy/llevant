name: PR gate

# Changes come from the maintainers; others open issues (docs/CONTRIBUTING.md, "How to
# contribute"). A pull request opened by someone who is not a collaborator is closed with
# a pointer there, unless its description names an issue labelled `pr-welcome`.
#
# `pull_request_target` runs this file as it is on main, with a token that can close the
# pull request. It never checks out or runs the pull request's code: it only reads its
# author, its description and the issues it names. Only `opened` triggers it, so a
# maintainer can reopen a closed pull request by hand.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: read

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Issues named in the description: #123 or a full link to an issue here.
            const body = pr.body || "";
            const numbers = new Set();
            for (const m of body.matchAll(/(?:^|[^\w&])#(\d+)\b/g)) numbers.add(Number(m[1]));
            const link = new RegExp(`github\\.com/${owner}/${repo}/issues/(\\d+)`, "gi");
            for (const m of body.matchAll(link)) numbers.add(Number(m[1]));

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                if (issue.pull_request) continue;
                if (issue.labels.some((l) => (typeof l === "string" ? l : l.name) === "pr-welcome")) {
                  core.info(`#${issue_number} is labelled pr-welcome: the pull request stays open.`);
                  return;
                }
              } catch (e) {
                core.info(`#${issue_number}: ${e.message}`);
              }
            }

            const guide = `https://github.com/${owner}/${repo}/blob/main/docs/CONTRIBUTING.md#how-to-contribute`;
            const newIssue = `https://github.com/${owner}/${repo}/issues/new/choose`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: [
                `Thank you for taking the time to work on llevant, @${pr.user.login}.`,
                "",
                "Code changes to llevant are made by its maintainers, so this pull request has been " +
                  "closed automatically. Nothing is wrong with you or your change: keeping the design " +
                  "of every change in a few hands is how llevant stays exact, fast and simple. " +
                  `[How to contribute](${guide}) explains why.`,
                "",
                `Please [open an issue](${newIssue}) describing the problem or the need behind this ` +
                  "change (link this pull request if it helps explain it). If a maintainer would like " +
                  "you to write the change, the issue gets the label `pr-welcome`, and a pull request " +
                  "naming it (`Fixes #123`) stays open. Changes made from your issue credit you.",
              ].join("\n"),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
