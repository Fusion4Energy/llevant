name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Property tests replay the same cases on every run here (random seeds run
  # nightly), so a failure is the change's, not the dice's.
  PROPTEST_RNG_SEED: "20261031"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace turns on the engine's `bench` feature (tools/bench); the
      # engine alone is built without it.
      - run: cargo clippy -p llevant --all-targets -- -D warnings
      # What docs.rs shows: no broken or private links.
      - run: cargo doc --no-deps --lib -p llevant -p llevant-scene -p llevant-render -p llevant-gpu -p llevant-viewer -p llevant-cli
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  # The GPU renderer and the viewer on Mesa's software Vulkan (lavapipe).
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      - run: sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - env:
          WGPU_BACKEND: vulkan
        run: cargo test --release -p llevant-gpu -p llevant-viewer

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: Swatinem/rust-cache@v2
      - working-directory: crates/llevant-py
        run: |
          python -m pip install maturin numpy pytest mypy polars pandas
          maturin build --release -o dist
          python -m pip install dist/*.whl
          python -m pytest tests

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
