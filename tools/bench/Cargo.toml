[package]
name = "llevant-bench"
description = "llevant's benchmarks and checks against brute force and the CPU, on any model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "llevant-bench"
path = "src/main.rs"

[dependencies]
mimalloc.workspace = true
bytemuck = "1.25"
llevant = { workspace = true, features = ["bench"] }
llevant-gpu.workspace = true
llevant-scene.workspace = true
migjorn.workspace = true
rayon.workspace = true
serde_json = "1"
wgpu = "30.0.1"

[target.'cfg(unix)'.dependencies]
# In-process sampling profiler (`LLEVANT_PROFILE`): needs no perf_event permissions.
# No `flamegraph` feature: it pulls in inferno (CDDL-1.0, not allowed by deny.toml).
pprof = { version = "0.15", default-features = false }

[lints]
workspace = true
